info:
  name: Detail anime
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/catalog/anime?q=naruto"
  params:
    - name: q
      value: naruto
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
