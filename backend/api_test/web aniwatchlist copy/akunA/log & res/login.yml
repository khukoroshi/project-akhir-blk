info:
  name: login
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}/auth/login"
  body:
    type: json
    data: '{"email":"khukoroshi@gmail.com","password":"Khuk0r0SH!"}'
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const cookies = res.getHeader("set-cookie") || [];
        const line = [].concat(cookies).find((c) => c.startsWith("csrf_token="));
        if (line) bru.setEnvVar("csrf", line.split(";")[0].split("=")[1]);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
