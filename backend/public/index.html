<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aplikasi Register Siswa</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <h1>Sistem Manajemen Siswa</h1>
    <div class="card">
      <h2 id="formTitle">Tambah Siswa Baru</h2>
      <form id="siswaForm">
        <input type="hidden" id="siswaId" />
        <div class="form-group">
          <label for="nama">Nama Lengkap</label>
          <input type="text" id="nama" required placeholder="Masukkan nama" />
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            required
            placeholder="Masukkan email"
          />
        </div>
        <div class="form-group">
          <label for="kelas">Kelas Lengkap</label>
          <input
            type="text"
            id="kelas"
            required
            placeholder="Contoh: 10 IPA 1"
          />
        </div>
        <button type="submit" id="btnSubmit">Simpan Data</button>
        <button
          type="button"
          id="btnBatal"
          style="display: none; background-color: #95a5a6"
        >
          Batal
        </button>
      </form>
    </div>
    <div class="card">
      <h2>Daftar Siswa</h2>
      <div class="search-bar">
        <label for="inputCari">
          <input
            type="text"
            id="inputCari"
            placeholder="Cari berdasarkan nama...."
          />
        </label>
        <button onclick="cariSiswa()">Cari</button>
        <button onclick="ambilSemuaSiswa()">Reset</button>
      </div>
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Nama</th>
            <th>Email</th>
            <th>Kelas</th>
            <th>Aksi</th>
          </tr>
        </thead>
        <tbody id="tabelSiswa"></tbody>
      </table>
    </div>

    <script src="./script.js"></script>
  </body>
</html>
